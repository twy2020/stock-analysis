[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chat-saas-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph==1.0.10",
  "Flask>=3.1,<4",
  "jsonschema>=4.23,<5",
  "Pillow>=11,<13",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<46",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "gunicorn>=23,<24; platform_system != 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "respx>=0.22,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]
