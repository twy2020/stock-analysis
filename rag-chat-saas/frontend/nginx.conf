server {
  listen 80;
  server_name _;
  client_max_body_size 30m;
  root /usr/share/nginx/html;
  index index.html;

  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    application/json json;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    font/woff2 woff2;
  }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        # Re-resolve Compose DNS after the backend container is recreated.
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 3s;
        set $stock_backend http://backend:8000;
        proxy_pass $stock_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
